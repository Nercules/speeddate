services:
  speeddate:
    build:
      context: .
    container_name: speeddate
    restart: unless-stopped
    ports:
      - "8050:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m
