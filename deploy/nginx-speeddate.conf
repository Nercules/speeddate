# Plaats dit server-blok in de Nginx-configuratie wanneer je gewone Nginx
# gebruikt. Pas 127.0.0.1 aan naar het LAN-adres van de Docker-host als
# Nginx op een andere machine of in een niet-gekoppelde container draait.
server {
    listen 80;
    listen [::]:80;
    server_name speeddate.nerc.me;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
